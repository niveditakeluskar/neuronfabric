# NeuroGuard requirements registry
#
# Derived from NG-TDS-000 v2.0.0-candidate (see docs/00-source-specifications/specification_manifest.yaml).
# Every entry is DRAFT. The TDS sign-off register (§F9) is entirely PENDING, so nothing here is approved.
#
# Field reference
#   id                   stable NG-<AREA>-NNN identifier (never reused or renumbered)
#   source_ids           identifiers used for this requirement in the source document (preserved verbatim)
#   source_refs          "TDS §<section>#<item>". The item number is the TDS-global numbered LLD line (1–123).
#   owner                TDS role (a named person is assigned in governance/approvals once known; see FND-014)
#   priority             P0 = G0 / release-blocking safety or security; P1 = first commercial release; P2 = conditional / later
#   section_gate         TDS section gate (G-A1 … G-E4)
#   program_gate         TDS program gate (G0 … G11), set ONLY where the TDS states it explicitly (FND-005)
#   status               lifecycle state (governance/workflow.yaml)
#   verification_method  type: test | inspection | analysis | demonstration | review
#
# Test IDs and evidence links are kept in governance/traceability.yaml, not here.

schema_version: 1
document: requirements_registry
source_document: NG-TDS-000
source_version: 2.0.0-candidate
generated_on: "2026-10-23"

id_prefixes:
  NG-SYS: System requirements
  NG-HW: Hardware
  NG-OS: Customized operating system
  NG-LNX: Linux kernel engine
  NG-RST: Rust runtime
  NG-WIN: Windows sensor
  NG-K8S: Kubernetes
  NG-NET: Network infrastructure
  NG-PAM: Privileged access management
  NG-BRN: Central Brain
  NG-AI: Behavioral intelligence
  NG-POL: Policy and enforcement
  NG-SEC: Cybersecurity
  NG-API: Interface contracts
  NG-DAT: Data models
  NG-OPS: Operations
  NG-TST: Testing
  NG-REL: Releases

# Explicit mapping of identifiers that already exist in the source document.
# TDS §F6 IDs are kept unchanged. TDS §F5 G0 checklist IDs do not follow the NG- scheme,
# so each maps to the NG- requirement that carries it in source_ids.
