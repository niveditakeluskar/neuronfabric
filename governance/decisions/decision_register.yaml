# Architecture Decision Register
#
# status          lifecycle state (governance/workflow.yaml). No decision is APPROVED: the TDS §F9 sign-off register is all PENDING.
# source_state    the state the TDS itself assigns (verbatim), kept for traceability
# freeze_by       program gate by which the decision must be APPROVED (TDS §F7 where stated)
# record          path to the full ADR markdown, created when the decision enters REVIEW with a written rationale
#
# ADR-001…ADR-008 keep their TDS IDs. ADR-009…ADR-017 are the TDS §F7 open decisions.
# ADR-018…ADR-029 are decisions the TDS leaves open in section bodies or that came out of findings.
# ADR-030…ADR-031 are repository governance decisions made during Prompt 00.

